name: CI

on:
  workflow_dispatch:
  push:
  schedule:
    - cron:  '10 5 * * *' # run once a day
  pull_request:
    branches:
      - main
      - next


env:
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}.${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:

  BuildAndTest:
    name: ${{ matrix.os }} ${{ matrix.app }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Default: unique_ptr_enabled across all platforms on JUCE 8
          - { app: unique_ptr_enabled,  os: ubuntu-latest, juce: JUCE8 }
          - { app: unique_ptr_enabled,  os: macos-15,      juce: JUCE8 }
          - { app: unique_ptr_enabled,  os: windows-2022,  juce: JUCE8 }
          # Sanity checks (single platform each)
          - { app: unique_ptr_enabled,  os: ubuntu-latest, juce: JUCE7 }
          - { app: unique_ptr_disabled, os: ubuntu-latest, juce: JUCE8 }
          - { app: member_enabled,      os: ubuntu-latest, juce: JUCE8 }
          - { app: automation_fixture,  os: ubuntu-latest, juce: JUCE8, automation_e2e: true }
          - { app: unique_ptr_disabled, os: ubuntu-latest, juce: JUCE8, demorunner_e2e: true }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use dev command prompt (Windows)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: 10.0.22621.0 # fixed to break random CI breakage

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install macOS Deps
        if: ${{ runner.os == 'macOS' }}
        run: brew install ninja osxutils

      - name: Install Linux Deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt install libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfontconfig1-dev libfreetype-dev libglu1-mesa-dev libjack-jackd2-dev libcurl4-openssl-dev ninja-build xvfb
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            sudo apt install libwebkit2gtk-4.1-dev
          else
            sudo apt install libwebkit2gtk-4.0-dev
          fi

      # This block can be removed once 15.1 is default (JUCE requires it when building on macOS 14)
      - name: Use latest Xcode on system (macOS)
        if: ${{ matrix.os == 'macos-15' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure (Windows without Ninja)
        if: runner.os == 'Windows'
        run: |
          automation_flags=""
          if [ "${{ matrix.automation_e2e }}" == "true" ]; then
            automation_flags="-DMELATONIN_INSPECTOR_ENABLE_AUTOMATION=ON -DMELATONIN_INSPECTOR_BUILD_CLI=ON"
          fi
          if [ "${{ matrix.demorunner_e2e }}" == "true" ]; then
            automation_flags="-DMELATONIN_INSPECTOR_ENABLE_AUTOMATION=ON -DMELATONIN_INSPECTOR_BUILD_CLI=ON -DMELATONIN_INSPECTOR_BUILD_DEMORUNNER_AUTOMATION=ON"
          fi

          if [ "${{ matrix.juce }}" == "JUCE7" ]; then
            cmake -B Builds -DTARGET_NAME:STRING=${{ matrix.app }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache $automation_flags . -DJUCE7=ON
          else 
            cmake -B Builds -DTARGET_NAME:STRING=${{ matrix.app }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache $automation_flags .
          fi

      - name: Configure (Non-Windows with Ninja)
        if: runner.os != 'Windows'
        run: |
            automation_flags=""
            if [ "${{ matrix.automation_e2e }}" == "true" ]; then
              automation_flags="-DMELATONIN_INSPECTOR_ENABLE_AUTOMATION=ON -DMELATONIN_INSPECTOR_BUILD_CLI=ON"
            fi
            if [ "${{ matrix.demorunner_e2e }}" == "true" ]; then
              automation_flags="-DMELATONIN_INSPECTOR_ENABLE_AUTOMATION=ON -DMELATONIN_INSPECTOR_BUILD_CLI=ON -DMELATONIN_INSPECTOR_BUILD_DEMORUNNER_AUTOMATION=ON"
            fi

            if [ "${{ matrix.juce }}" == "JUCE7" ]; then
              cmake -B Builds -G Ninja -DTARGET_NAME:STRING=${{ matrix.app }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache $automation_flags . -DJUCE7=ON
            else 
              cmake -B Builds -G Ninja -DTARGET_NAME:STRING=${{ matrix.app }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache $automation_flags .
            fi

      - name: Build
        run: cmake --build Builds --parallel 4

      - name: Run automation e2e
        if: ${{ matrix.automation_e2e == true && runner.os == 'Linux' }}
        env:
          MELATONIN_AUTOMATION_BUILD_DIR: ${{ github.workspace }}/Builds
          MELATONIN_SCREENSHOT_DIR: ${{ github.workspace }}/Builds/automation-evidence
        run: |
          mkdir -p "$MELATONIN_SCREENSHOT_DIR"
          xvfb-run -a Builds/automation_fixture_artefacts/automation_fixture

      - name: Run DemoRunner automation e2e
        if: ${{ matrix.demorunner_e2e == true && runner.os == 'Linux' }}
        env:
          MELATONIN_DEMORUNNER_ARTIFACT_DIR: ${{ github.workspace }}/Builds/demorunner-evidence
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$MELATONIN_DEMORUNNER_ARTIFACT_DIR"
          xvfb-run -a Builds/melatonin-demorunner-e2e_artefacts/melatonin-demorunner-e2e

      - name: Upload automation evidence
        if: ${{ always() && matrix.automation_e2e == true && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: automation-evidence-${{ matrix.os }}-${{ matrix.app }}
          path: Builds/automation-evidence
          if-no-files-found: ignore

      - name: Upload DemoRunner evidence
        if: ${{ always() && matrix.demorunner_e2e == true && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: demorunner-evidence-${{ matrix.os }}
          path: Builds/demorunner-evidence
          if-no-files-found: ignore

      - name: Run
        if: ${{ matrix.os == 'macos-latest' }}
        working-directory: Builds/${{ matrix.app }}_artefacts
        timeout-minutes: 2
        run: |
          ls -ahl
          ${{ matrix.app }}.app/Contents/MacOS/${{ matrix.app }} &

      - name: Run
        if: ${{ matrix.os == 'windows-latest' }}
        working-directory: Builds/${{ matrix.app }}_artefacts
        timeout-minutes: 2
        run: |
          ls -ahl
          ./Debug/${{ matrix.app }}.exe &

      - uses: OrbitalOwen/desktop-screenshot-action@0.1
        if: ${{ matrix.os == 'windows-latest' }}
        with:
          file-name: ${{ matrix.os }}-${{matrix.app}}.jpg
